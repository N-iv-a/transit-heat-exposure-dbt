version: 2

models:
  - name: mart_stop_heat_risk
    columns:
      - name: osm_node_id
        tests:
          - unique
          - not_null
      - name: risk_level
        tests:
          - accepted_values:
              arguments:
                values: ["low", "medium", "high"]
      - name: risk_level_binary
        tests:
          - accepted_values:
              arguments:
                values: ["low", "medium", "high"]

  - name: mart_stop_heat_wait_hourly
    columns:
      - name: osm_node_id
        tests:
          - not_null
      - name: hour
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [13, 14, 15, 16, 17, 18, 19]
      - name: exposure_score
        tests:
          - not_null
      - name: lon
        tests:
          - not_null
      - name: lat
        tests:
          - not_null
      - name: match_method
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ref", "nearest", "unmatched"]
      - name: wait_minutes
        description: Central wait, mixed model (random + timetable-synchronised riders). NULL without service.
      - name: wait_minutes_low
        description: Lower bound, min(any-line wait, wait_minutes).
      - name: wait_minutes_high
        description: Upper bound, headway/2 of the least frequent line.
      - name: wait_minutes_random
        description: Old estimate, headway/2 with random arrivals (median across lines).
      - name: exposed_wait_minutes
        description: exposure_score * wait_minutes (mixed).
      - name: risk_level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["low", "medium", "high"]

  - name: mart_stop_heat_wait
    columns:
      - name: osm_node_id
        tests:
          - unique
          - not_null
      - name: risk_level
        tests:
          - accepted_values:
              arguments:
                values: ["low", "medium", "high"]
      - name: risk_level_binary
        tests:
          - accepted_values:
              arguments:
                values: ["low", "medium", "high"]
      - name: match_method
        tests:
          - accepted_values:
              arguments:
                values: ["ref", "nearest", "unmatched"]
