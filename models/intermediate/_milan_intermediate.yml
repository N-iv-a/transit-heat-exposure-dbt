version: 2

models:
  - name: int_stop_wait_time
    columns:
      - name: gtfs_stop_id
        tests:
          - not_null
      - name: hour
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [13, 14, 15, 16, 17, 18, 19]
      - name: wait_time_bucket
        tests:
          - accepted_values:
              arguments:
                values: ["low", "medium", "high"]

  - name: int_osm_gtfs_stop_bridge
    columns:
      - name: osm_node_id
        tests:
          - unique
          - not_null
      - name: match_method
        tests:
          - accepted_values:
              arguments:
                values: ["ref", "nearest", "unmatched"]
