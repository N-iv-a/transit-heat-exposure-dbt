version: 2

sources:
  - name: raw_milan
    schema: raw_milan
    description: >
      Milan heat-exposure data, loaded by ingestion/load_milan.py. Unlike
      raw_emt/raw_gva, these tables aren't a raw GTFS feed -- they're the
      already-computed outputs of scripts/milan/solar_exposure.py and
      scripts/milan/wait_time.py (see docs/MILAN_DATA_DECISIONS.md for the
      full method and data-sourcing rationale for both).
    tables:
      - name: stop_solar_exposure
        description: >
          One row per (OSM stop node, hour), for June 28 2026 (the hottest
          day found in the ARPA analysis), hours 13-19 CEST (the empirical
          critical window). stop_id here is an OSM node id ("node/12345"),
          not a GTFS stop_id -- see stop_wait_time below.
      - name: stop_tree_shade
        description: >
          One row per (OSM stop node, hour) in tree crown shadow, with the
          nearest tree casting it (tree_id). From solar_exposure.py (T15).
      - name: stop_wait_time
        description: >
          One row per (GTFS stop_id, hour), median expected wait time
          (headway/2, per-line-then-median across lines) for the reference
          day 2026-09-13. stop_id here is a GTFS stop_id, a different ID
          space from stop_solar_exposure's OSM node ids -- see
          int_osm_gtfs_stop_bridge.sql for the bridge between the two.
      - name: osm_shelter_stops
        description: >
          One row per OSM public-transport stop node in Milan (from
          data_milan/seeds/osm_shelter/export_shelter_milano.geojson, an
          Overpass export), keyed by osm_node_id ("node/12345"). ref is the
          OSM tag meant to mirror the GTFS stop_id, when mapped; not always
          present or accurate -- see int_osm_gtfs_stop_bridge.sql.
      - name: trees
        description: >
          Census of municipal trees of Milan (Comune di Milano, ds2484,
          extraction 2025-03-31), from data_milan/seeds/trees/
          alberi_milano_20250331.csv.gz (built by
          scripts/milan/prepare_tree_seed.py). Unfiltered: plausibility
          filters are in stg_milan_trees. Municipal trees only.
