version: 2

models:
  - name: stg_emt__routes
    columns:
      - name: route_id
        tests:
          - unique
          - not_null
      - name: route_type
        tests:
          - accepted_values:
              arguments:
                values: [3]

  - name: stg_emt__trips
    columns:
      - name: trip_id
        tests:
          - unique
          - not_null
      - name: route_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_emt__routes')
                field: route_id

  - name: stg_emt__stops
    columns:
      - name: stop_id
        tests:
          - unique
          - not_null
      - name: wheelchair_boarding
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2]
              config:
                where: "wheelchair_boarding is not null"

  - name: stg_emt__stop_times
    columns:
      - name: trip_id
        tests:
          - not_null
      - name: stop_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_emt__stops')
                field: stop_id
