version: 2

models:
  - name: mart_stop_heat_risk
    columns:
      - name: osm_node_id
        tests:
          - unique
          - not_null
      - name: risk_level
        tests:
          - accepted_values:
              arguments:
                values: ["low", "medium", "high"]
      - name: risk_level_binary
        tests:
          - accepted_values:
              arguments:
                values: ["low", "medium", "high"]

  - name: mart_stop_heat_wait
    columns:
      - name: osm_node_id
        tests:
          - unique
          - not_null
      - name: risk_level
        tests:
          - accepted_values:
              arguments:
                values: ["low", "medium", "high"]
      - name: risk_level_binary
        tests:
          - accepted_values:
              arguments:
                values: ["low", "medium", "high"]
      - name: match_method
        tests:
          - accepted_values:
              arguments:
                values: ["ref", "nearest", "unmatched"]
