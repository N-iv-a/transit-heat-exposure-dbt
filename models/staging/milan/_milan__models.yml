version: 2

models:
  - name: stg_stop_solar_exposure
    columns:
      - name: osm_node_id
        tests:
          - not_null
      - name: hour
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [12, 13, 14, 15, 16, 17, 18]
      - name: exposure_score
        tests:
          - not_null

  - name: stg_osm_shelter_stops
    columns:
      - name: osm_node_id
        tests:
          - not_null
          - unique
