name: gtfs_valencia
version: "1.0.0"
config-version: 2

profile: gtfs_valencia

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  gtfs_valencia:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

vars:
  # Mixed wait model (int_stop_wait_time, docs/MILAN_DATA_DECISIONS.md section 7).
  # Assumptions, not measured values.
  sync_share_max: 0.5      # max share of riders who time arrival to the timetable
  sync_wait_minutes: 2     # wait of those riders, capped at headway/2
